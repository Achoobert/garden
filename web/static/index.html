<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGarden | Urban Thai Concierge</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .thai-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #064e3b 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="thai-gradient text-white py-8 px-6 mb-8 rounded-b-[3rem] shadow-2xl">
        <div class="max-w-md mx-auto">
            <h1 class="text-3xl font-bold tracking-tight">iGarden Concierge 🌿</h1>
            <p class="opacity-80 text-sm mt-1">Premium Plant Care for the Urban Professional</p>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4">
        <div id="setup" class="glass rounded-3xl p-8 shadow-xl border border-white">
            <h2 class="text-xl font-semibold mb-6 text-slate-800">Welcome, Khun.</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Full Name & Title</label>
                    <input type="text" id="username" class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Khun Somchai">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Daily Time</label>
                        <input type="number" id="time_budget" class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500" placeholder="Mins">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Monthly Budget</label>
                        <input type="number" id="cash_budget" class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500" placeholder="THB">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Garden Space</label>
                    <select id="space_type" class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500 appearance-none">
                        <option value="balcony">Luxury Balcony</option>
                        <option value="lawn">Private Lawn</option>
                        <option value="porch">Porch / Entrance</option>
                        <option value="indoors">Indoor Atrium</option>
                    </select>
                </div>
                <button onclick="register()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-semibold shadow-lg hover:bg-black transition-all">
                    Initialize My Garden
                </button>
            </div>
        </div>

        <div id="garden" style="display:none;" class="space-y-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-slate-800">Your Estates</h2>
                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">Rainy Season Mode</span>
            </div>
            <div id="plant-list" class="space-y-6"></div>
        </div>
    </main>


    <script>
        let userId = localStorage.getItem('igarden_user_id');
        
        async function register() {
            const data = {
                username: document.getElementById('username').value,
                time_budget: parseInt(document.getElementById('time_budget').value),
                cash_budget: parseFloat(document.getElementById('cash_budget').value),
                space_type: document.getElementById('space_type').value
            };
            const resp = await fetch('/api/register', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            const user = await resp.json();
            userId = user.id;
            localStorage.setItem('igarden_user_id', userId);
            showGarden();
        }

        async function showGarden() {
            if (!userId) return;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('garden').style.display = 'block';

            const resp = await fetch(`/api/garden?user_id=${userId}`);
            const plants = await resp.json();
            const list = document.getElementById('plant-list');
            list.innerHTML = '';

            plants.forEach(p => {
                const div = document.createElement('div');
                div.className = 'glass rounded-3xl p-6 shadow-lg border border-white relative overflow-hidden';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">${p.plant_name}</h3>
                            <p class="text-xs text-slate-500 font-medium">Last Care: ${new Date(p.last_water).toLocaleTimeString()}</p>
                        </div>
                        <i class="fa-solid fa-leaf text-green-500 text-2xl opacity-20"></i>
                    </div>
                    
                    <div id="alert-${p.id}" class="text-xs font-bold text-red-500 mb-4 h-4"></div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="doAction(${p.id}, 'water')" class="bg-blue-50 text-blue-600 p-3 rounded-xl text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-droplet mr-1"></i> Water
                        </button>
                        <button onclick="doAction(${p.id}, 'feed')" class="bg-green-50 text-green-600 p-3 rounded-xl text-xs font-bold hover:bg-green-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-flask mr-1"></i> Feed
                        </button>
                        <button onclick="doAction(${p.id}, 'pest')" class="bg-orange-50 text-orange-600 p-3 rounded-xl text-xs font-bold hover:bg-orange-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-bug-slash mr-1"></i> Pest
                        </button>
                        <button onclick="doAction(${p.id}, 'sun')" class="bg-yellow-50 text-yellow-600 p-3 rounded-xl text-xs font-bold hover:bg-yellow-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-sun mr-1"></i> Rotate
                        </button>
                    </div>
                `;
                list.appendChild(div);
                checkStatus(p);
            });
        }


        async function doAction(userPlantId, action) {
            await fetch('/api/action', {
                method: 'POST',
                body: JSON.stringify({ user_plant_id: userPlantId, action: action })
            });
            showGarden();
        }

        function checkStatus(p) {
            const now = new Date();
            const alertElement = document.getElementById(`alert-${p.id}`);
            if (alertElement) alertElement.innerText = '';
            
            checkActivity(p, p.last_water, 5, 'Water');
            checkActivity(p, p.last_feed, 10, 'Feed');
            checkActivity(p, p.last_pest, 15, 'Pest Control');
            checkActivity(p, p.last_sun, 20, 'Rotate');
        }


        if (userId) showGarden();

        // Notification Permission
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Auto refresh
        setInterval(showGarden, 30000);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
